_format_version: "3.0"

services:
  - name: user-service
    
    url: http://app:8081
    routes:
      - name: graphql
        paths: ["/graphql"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["POST","OPTIONS"]
      headers: ["Content-Type","Authorization"]
      max_age: 3600
